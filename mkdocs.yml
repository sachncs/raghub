site_name: Revex
site_url: https://github.com/sachncs/revex
repo_url: https://github.com/sachncs/revex
edit_uri: blob/master/docs
docs_dir: docs

nav:
  - Home: index.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Workspace model: guide/workspace.md
      - Onboarding: guide/onboarding.md
      - RBAC & ACL: guide/rbac-acl.md
      - Ingestion: guide/ingestion.md
      - Retrieval & reranking: guide/retrieval.md
      - Orchestrator & agents: guide/orchestration.md
      - Embedders & LLM: guide/llm-embedding.md
      - Workers & jobs: guide/workers-jobs.md
      - Evaluation: guide/eval.md
      - Telemetry: guide/telemetry.md
      - Web console: guide/web.md
      - Development: guide/development.md
  - Architecture:
      - Overview: architecture/overview.md
  - Reference:
      - HTTP API: reference/api.md
      - CLI: reference/cli.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
  features:
    - navigation.expand
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets