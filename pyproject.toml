[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raghub"
version = "0.5.0"
description = "RAGHub — production-grade multi-user retrieval-augmented generation platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sachin <sachncs@gmail.com>" }]
keywords = [
    "rag",
    "raghub",
    "llm",
    "retrieval-augmented-generation",
    "vector-search",
    "fastapi",
]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.8,<3",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "chonkie>=1.0,<2",
    "litellm>=1.40,<2",
    "loguru>=0.7,<1",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
    "prometheus-client>=0.20,<1",
    "rank-bm25>=0.2,<1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
pdf = ["marker-pdf>=1.0,<1.10", "pypdf>=6.0,<7"]
graph = ["python-igraph>=0.11,<1", "leidenalg>=0.10,<1", "scikit-learn>=1.4,<2"]
rerank = ["cohere>=5,<6", "ragatouille>=0.0.8,<1", "rank-bm25>=0.2,<1"]
web = ["duckduckgo-search>=6,<7"]
docs = [
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10.1,<11",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.21,<1",
]
auth = ["bcrypt>=4", "aiosqlite>=0.19,<1"]
otel = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1",
]
langfuse = ["langfuse>=2.0,<4"]
tiktoken = ["tiktoken>=0.5,<1"]
structured = ["instructor>=1.3,<2"]
eval = ["datasets>=2.20,<4"]
ragas = ["ragas>=0.1,<1"]
all = [
    "marker-pdf>=1.0,<1.10",
    "pypdf>=6.0,<7",
    "python-igraph>=0.11,<1",
    "leidenalg>=0.10,<1",
    "scikit-learn>=1.4,<2",
    "cohere>=5,<6",
    "ragatouille>=0.0.8,<1",
    "duckduckgo-search>=6,<7",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10.1,<11",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.21,<1",
    "bcrypt>=4",
    "aiosqlite>=0.19,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1",
    "langfuse>=2.0,<4",
    "tiktoken>=0.5,<1",
    "instructor>=1.3,<2",
    "datasets>=2.20,<4",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4,<7",
    "hypothesis>=6,<7",
    "reportlab>=4.2,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6,<7",
    "interrogate>=1.7,<2",
    "mkdocs>=1.5,<2",
    "build>=1.0,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pip-tools>=7.4,<8",
]

[project.scripts]
raghub = "raghub.cli:main"
raghub-financebench = "raghub.evaluation:app"

[project.entry-points."raghub.plugins"]
# A plugin is any class with a ``register(registry)`` method. The
# default registry already exposes every built-in component, so
# the entry-point group is empty by default. Add your own plugins
# here. Example::
#
#   [project.entry-points."raghub.plugins"]
#   my_plugin = "my_package.module:my_plugin_factory"
#

[project.urls]
Homepage = "https://github.com/sachncs/raghub"
Repository = "https://github.com/sachncs/raghub"
Issues = "https://github.com/sachncs/raghub/issues"
Documentation = "https://github.com/sachncs/raghub/blob/main/docs/index.md"
Changelog = "https://github.com/sachncs/raghub/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["raghub*"]
exclude = ["tests*", "data*", "documents*", "devtools*", "docs*"]

[tool.setuptools.package-data]
raghub = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D", "N", "PLR"]
ignore = [
    "E501",  # Phase 1 fixes the long-line violations; strict-100-chars rule enforced.
    "B008",  # Phase 1 migrates function-call-in-default to Field(default_factory=...).
    "B017",  # Phase 1 narrows pytest.raises(Exception) to specific exception types.
    "B018",  # Phase 1 removes useless-expression statements.
    "RUF002",  # Phase 1 strips non-ASCII characters from docstrings.
    "RUF003",  # Phase 1 strips ambiguous characters from comments/docstrings.
    "RUF012",  # Phase 1 replaces mutable class-default annotations.
    "RUF015",  # Phase 1 removes iterable-casting-before-sum patterns.
    "RUF043",  # Phase 1 replaces Optional[X] with X | None.
    "RUF059",  # Phase 1 removes unused staged annotations.
    "SIM103",  # Phase 1 collapses trivial if-return-bool into direct returns.
    "SIM105",  # Phase 1 uses contextlib.suppress where appropriate.
    "SIM117",  # Phase 1 merges adjacent with-statements.
    "SIM201",  # Phase 1 removes negation-on-if-equality.
    "UP042",  # Phase 1 replaces Union[X, Y] with X | Y.
    "UP047",  # Phase 1 adopts PEP 695 generics.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0913", "D"]  # Phase 4 normalises test code; magic numbers and long signatures are fine in fixtures.
"docs/*" = ["D"]
"devtools/*" = ["PLR0913", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=raghub --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.interrogate]
exclude = ["tests", "build", "dist", "devtools"]
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-module = false
fail-under = 95
