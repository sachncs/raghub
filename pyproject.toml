[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raghub"
version = "0.9.5"
description = "RAGHub — production-grade multi-user retrieval-augmented generation platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sachin <sachncs@gmail.com>" }]
keywords = [
    "rag",
    "raghub",
    "llm",
    "retrieval-augmented-generation",
    "vector-search",
    "fastapi",
]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "chonkie>=1.0,<2",
    "litellm>=1.40,<2",
    "langfuse>=2.0,<4",
    "loguru>=0.7,<1",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
    "rank-bm25>=0.2,<1",
    "asyncpg>=0.29,<1",
    "cryptography>=42,<44",
    "httpx>=0.27,<1",
    "openai>=1.0,<3",
    "instructor>=1.3,<2",
    "aiosqlite>=0.19,<1",
    "bcrypt>=4",
    "pypdf>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10.1,<11",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
    "python-pptx>=0.6.21,<1",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "zstandard>=0.22,<1",
    "gigatoken>=0.10,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4,<7",
    "hypothesis>=6,<7",
    "reportlab>=4.2,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
    "types-PyYAML>=6,<7",
    "interrogate>=1.7,<2",
    "mkdocs>=1.5,<2",
    "build>=1.0,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pip-tools>=7.4,<8",
]
all = [
    "marker-pdf>=0.15,<1",
    "pypdf>=6.0,<7",
]

[project.scripts]
raghub = "raghub.cli:main"
raghub-financebench = "raghub.evaluation:app"

[project.entry-points."raghub.plugins"]
# A plugin is any class with a ``register(registry)`` method. The
# default registry already exposes every built-in component, so
# the entry-point group is empty by default. Add your own plugins
# here. Example::
#
#   [project.entry-points."raghub.plugins"]
#   my_plugin = "my_package.module:my_plugin_factory"
#

[project.urls]
Homepage = "https://github.com/sachncs/raghub"
Repository = "https://github.com/sachncs/raghub"
Issues = "https://github.com/sachncs/raghub/issues"
Documentation = "https://github.com/sachncs/raghub/blob/main/docs/index.md"
Changelog = "https://github.com/sachncs/raghub/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["raghub*"]
exclude = ["tests*", "data*", "documents*", "devtools*", "docs*"]

[tool.setuptools.package-data]
raghub = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D", "N", "PLR"]
preview = true

[tool.ruff.lint.per-file-ignores]
# Tests: pytest-idiom exceptions only (magic numbers / long signatures in
# fixtures, docstrings, test-class methods that don't use `self`, async
# test helpers without an await).
#
# raghub/services/facade.py and raghub/stores/vector_sqlite.py and
# raghub/plugins.py each implement a registry surface (one public
# method per registered component) and intentionally exceed the
# default method cap; folding them would break the registry contract.
#
# raghub/lifecycle/chunking.py builds a chunk from many
# independently-configurable fields; collapsing them into a config
# object would hide the ergonomics that the existing call sites rely
# on.
#
# raghub/repos.py PLR6301: ChunkRepository / SessionRepository /
# DocumentRepository get() / list_by_document() / search_by_metadata()
# are instance methods (they're separately overridden by the SQLite
# subclasses in DocStore / SessionStore / ChunkStore). The default
# implementations return None / []; mypy flags the unused ``self``
# but the contract is genuinely an instance method.
"tests/*" = ["PLR2004", "PLR0913", "D", "PLR6301", "RUF029", "SIM117", "RUF012"]
"docs/*" = ["D"]
"devtools/*" = ["PLR0913", "D"]
"raghub/services/facade.py" = ["PLR0904"]
"raghub/stores/vector_sqlite.py" = ["PLR0904"]
"raghub/plugins.py" = ["PLR0904"]
"raghub/lifecycle/chunking.py" = ["PLR0913"]
"raghub/repos.py" = ["PLR6301", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true
no_implicit_reexport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--cov=raghub", "--cov-report=term-missing", "--cov-fail-under=70", "-p", "no:logfire"]
filterwarnings = [
]

[tool.coverage.run]
# `__init__.py` modules are import-and-re-export only — coverage on them
# is exercised transitively by their consumers. Pure data and constant
# modules are exercised by their call sites. /raghub/stores/vector_schema.py
# is a legacy SQLite-schema introspection helper that requires a live
# schema to exercise any line, so the integration tests cover it
# elsewhere.
omit = [
    "raghub/__init__.py",
    "raghub/*/__init__.py",
    "raghub/api.py",
    "raghub/typed_dicts.py",
    "raghub/types.py",
    "raghub/errors.py",
    "raghub/constants.py",
    "raghub/rerank_result.py",
    "raghub/io.py",
    "raghub/registry.py",
    "raghub/sse/core.py",
    "raghub/ids.py",
    "raghub/runtime.py",
    "raghub/models/__init__.py",
    "raghub/stores/vector_schema.py",
    "raghub/stores/images.py",
    "raghub/routes/limits.py",
    "raghub/agents/__init__.py",
]

[tool.interrogate]
exclude = ["tests", "build", "dist", "devtools", "lint"]
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-module = false
fail-under = 100

# ---------------------------------------------------------------------------
# Bandit security linter (AGENTS.md §962-1026)
# ---------------------------------------------------------------------------

[tool.bandit]
# Skip hardcoded-password and binding-to-all-interfaces warnings: the
# framework legitimately reads credential env vars (JWT_SECRET, API keys)
# and never binds sockets itself (that's uvicorn's job).
skips = ["B105", "B104"]
exclude_dirs = ["tests/", "devtools/", "data/"]
# Tests: medium-and-above severity only.
level = "MEDIUM"
confidence = "MEDIUM"

# ---------------------------------------------------------------------------
# Pyright (AGENTS.md §962-1026 alternative type checker)
# ---------------------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalOperand = false
reportOptionalContextManager = false
reportOptionalGenerator = false
