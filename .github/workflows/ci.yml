name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild -r better-sqlite3 @sqlite.org/sqlite-vec

  gates:
    name: ${{ matrix.task }}
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild -r better-sqlite3 @sqlite.org/sqlite-vec
      - name: ${{ matrix.task }}
        run: pnpm turbo run ${{ matrix.task }}

  web-e2e:
    name: Web smoke (agent-browser)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild -r better-sqlite3 @sqlite.org/sqlite-vec
      - name: Install agent-browser
        run: |
          curl -fsSL https://agent-browser.dev/install.sh | sh
          agent-browser install
      - name: Build packages
        run: pnpm turbo run build
      - name: Boot API + run web smoke
        env:
          RAGHUB_LLM_STUB: '1'
        run: |
          pnpm --filter @raghub/api start &
          API_PID=$!
          pnpm --filter @raghub/web start --port 3001 &
          WEB_PID=$!
          trap "kill $API_PID $WEB_PID" EXIT
          pnpm e2e